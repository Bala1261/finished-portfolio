name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint + typecheck + unit tests + production build — the local `npm run ci` gate.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, unit tests, build
        run: npm run ci

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # Playwright e2e (smoke + axe accessibility + responsive) against the
  # production build. Builds fresh so the suite always exercises HEAD.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # The webServer config runs `vite preview`, which serves dist/ — so the
      # suite has something to test, dist/ must exist first. (Missing build
      # here is why the first pipeline runs failed: preview refuses to start,
      # and every render-dependent test timed out on a dead server.)
      - name: Build for production
        run: npm run build

      - name: Run e2e suite
        run: npm run e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Mobile-emulated Lighthouse audits with score gates. Uses the same
  # self-launched-Chrome runner as local runs (chrome-launcher's temp-profile
  # cleanup is broken on some Windows setups, so the repo never depends on it).
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      # Stock LHCI for CI: its chrome-launcher is battle-tested on Linux
      # runners. The custom scripts/lighthouse.mjs remains `npm run lh` for
      # Windows dev boxes, where chrome-launcher's temp-profile cleanup breaks.
      # Point chrome-launcher at Playwright's chromium via its registry path
      # (deterministic, no shell globs).
      - name: Resolve Playwright chromium path
        id: chromepath
        run: |
          node --input-type=module -e \
            "import {chromium} from 'playwright-core'; console.log('::output name=path::' + chromium.executablePath())" \
            >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse CI (mobile, gated)
        run: npx lhci autorun
        env:
          CHROME_PATH: ${{ steps.chromepath.outputs.path }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14

  # Publishes the production build to GitHub Pages — only after every gate
  # above passed, and only for pushes to main (PRs verify but never deploy).
  # Rebuilds with the repo-subpath base (`npm run build:pages`) because Pages
  # serves this repo under /Portfolio/: the verify job's dist/ artifact has
  # the default '/' base used by vite preview and Lighthouse.
  # One-time repo setting: Pages → Source → "GitHub Actions".
  deploy:
    needs: [verify, e2e, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages (repo-subpath base + SPA fallback)
        run: npm run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
