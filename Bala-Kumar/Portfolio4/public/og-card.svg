<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Transmission-series social card — follows docs/VISUAL-ENHANCEMENT-PLAN.md coherence rules:
       #0A0B11 ground, violet grid 12%, ink title, gold/cyan signal accents, mono SIG caption. -->
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C9A45C" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C9A45C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect width="1200" height="630" fill="#0A0B11"/>

  <!-- violet survey grid -->
  <g stroke="#8B5CF6" stroke-opacity="0.12" stroke-width="1">
    <path d="M 60 0 V 630 M 180 0 V 630 M 300 0 V 630 M 420 0 V 630 M 540 0 V 630 M 660 0 V 630 M 780 0 V 630 M 900 0 V 630 M 1020 0 V 630 M 1140 0 V 630"/>
    <path d="M 0 90 H 1200 M 0 210 H 1200 M 0 330 H 1200 M 0 450 H 1200 M 0 570 H 1200"/>
  </g>

  <!-- glows -->
  <ellipse cx="330" cy="250" rx="420" ry="260" fill="url(#halo)"/>
  <ellipse cx="960" cy="330" rx="330" ry="300" fill="url(#haloCyan)"/>

  <!-- transmission relay (right) -->
  <g fill="none">
    <circle cx="950" cy="315" r="175" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="950" cy="315" r="120" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 10"/>
    <circle cx="950" cy="315" r="65" stroke="#C9A45C" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="950" cy="315" r="9" fill="#C9A45C"/>
    <circle cx="950" cy="140" r="6" fill="#22D3EE"/>
    <circle cx="1104" cy="255" r="6" fill="#F5F7FA" fill-opacity="0.85"/>
    <circle cx="1064" cy="427" r="6" fill="#C9A45C" fill-opacity="0.9"/>
    <circle cx="836" cy="255" r="5" fill="#8B5CF6"/>
    <path d="M 950 306 L 950 150" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M 941 315 L 851 262" stroke="#C9A45C" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M 958 320 L 1096 250" stroke="#F5F7FA" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M 836 255 L 886 255" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>

  <!-- packet lanes (bottom) -->
  <g stroke-width="1.5">
    <line x1="80" y1="492" x2="700" y2="492" stroke="#F5F7FA" stroke-opacity="0.14"/>
    <line x1="80" y1="524" x2="700" y2="524" stroke="#F5F7FA" stroke-opacity="0.14"/>
    <line x1="80" y1="556" x2="700" y2="556" stroke="#F5F7FA" stroke-opacity="0.14"/>
  </g>
  <g>
    <circle cx="180" cy="492" r="4" fill="#C9A45C"/>
    <circle cx="340" cy="492" r="4" fill="#C9A45C" fill-opacity="0.55"/>
    <circle cx="520" cy="492" r="4" fill="#F5F7FA" fill-opacity="0.7"/>
    <circle cx="260" cy="524" r="4" fill="#22D3EE"/>
    <circle cx="430" cy="524" r="4" fill="#22D3EE" fill-opacity="0.5"/>
    <circle cx="620" cy="524" r="4" fill="#C9A45C" fill-opacity="0.8"/>
    <circle cx="220" cy="556" r="4" fill="#F5F7FA" fill-opacity="0.5"/>
    <circle cx="470" cy="556" r="4" fill="#C9A45C"/>
    <circle cx="660" cy="556" r="4" fill="#22D3EE" fill-opacity="0.7"/>
  </g>
  <g font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="15" fill="#A7AFBF">
    <text x="80" y="478">TX —</text>
    <text x="1128" y="478" text-anchor="end">— RX</text>
  </g>

  <!-- SIG caption chip -->
  <g>
    <rect x="80" y="64" width="252" height="38" rx="19" fill="none" stroke="#C9A45C" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="103" cy="83" r="4.5" fill="#34D399"/>
    <text x="118" y="89" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="17" letter-spacing="2" fill="#EFE3C2">SIG 00 · PORTFOLIO</text>
  </g>

  <!-- identity block -->
  <text x="76" y="252" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-weight="800" font-size="128" letter-spacing="-4" fill="#F5F7FA">RAHUL R</text>
  <text x="80" y="316" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="33" letter-spacing="10" fill="#C9A45C">AI × DATA × CODE</text>
  <text x="80" y="380" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="26" fill="#A7AFBF">Building useful things with code — projects, data and interactive experiments.</text>

  <!-- frame + series caption -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#F5F7FA" stroke-opacity="0.08" stroke-width="1"/>
  <text x="1120" y="594" text-anchor="end" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="14" letter-spacing="2" fill="#F5F7FA" fill-opacity="0.45">TRANSMISSION SERIES · 01</text>
</svg>
